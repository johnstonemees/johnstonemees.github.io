<script>

		
function stealprofile(){
	var xhr = new XMLHttpRequest();
        xhr.open("GET", "https://api.schoolspringstaging.com/api/CCandidate/GetCandidateInfoById/7602032", true);
        xhr.setRequestHeader("Accept", "*/*");
        xhr.setRequestHeader("Accept-Language", "zh-CN,zh;q=0.8,en-US;q=0.5,en;q=0.3");
        xhr.setRequestHeader("Content-Type", "application/json; charset=utf-8");
        xhr.withCredentials = true;
        xhr.send();
 	xhr.onreadystatechange = function(){
	    //若响应完成且请求成功
	    if(xhr.readyState === 4 && xhr.status === 200){
		document.getElementById("customer").innerHTML = xhr.responseText;
		console.log("Success");
	    }
	}
	var xhr1 = new XMLHttpRequest();
        xhr1.open("GET", "https://api.schoolspringstaging.com/api/jobs/ats/Reference?domainName=", true);
        xhr1.setRequestHeader("Accept", "*/*");
        xhr1.setRequestHeader("Accept-Language", "zh-CN,zh;q=0.8,en-US;q=0.5,en;q=0.3");
        xhr1.setRequestHeader("Content-Type", "application/json; charset=utf-8");

 	xhr1.onreadystatechange = function(){

	    if(xhr1.readyState === 4 && xhr1.status === 200){
		document.getElementById("Reference").innerHTML = xhr1.responseText;
		console.log("Success");
	    }
	}
	var xhr2 = new XMLHttpRequest();

 	xhr2.onreadystatechange = function(){
	    //若响应完成且请求成功
	    if(xhr2.readyState === 4 && xhr2.status === 200){
		document.getElementById("candidate").innerHTML = xhr2.responseText;

}
