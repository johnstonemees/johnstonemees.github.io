const targetAddress = 'https://cnbs-api.underarmour.cn/graphql/?opname=queryAddressList'; 

// 请求头配置（CORS跨域需明确指定Content-Type）
const requestOptions = {
  method: 'POST',
  mode: 'cors', // 启用CORS模式
  headers: {
    'Content-Type': 'application/json',
  },
  body: JSON.stringify({
    "operationName": "queryAddressList",
    "variables": {
      "memberCode": "",
      "pageInput": {
        "pageNum": 1,
        "pageSize": 100
      }
    },
    "query": `query queryAddressList($memberCode: String!, $pageInput: PageInput) {
  data: queryMemberShippingAddressUAList(
    memberCode: $memberCode
    pageInput: $pageInput
  ) {
    dataList: edges {
      data: node {
        ...addressInfo
        __typename
      }
      __typename
    }
    __typename
  }
}

fragment addressInfo on MemberShippingAddress {
  addressCode
  stateName
  cityName
  districtName
  address1
  recipientFirstName
  recipientLastName
  recipientMobile
  defaultAddress
  recipientEmail
  recipientMobile
  stateCode
  cityCode
  districtCode
  zipCode
  taxId
  companyName
  type
  countryCode
  __typename
}`
  })
};

// 发送请求并处理响应
fetch(targetAddress, requestOptions)
  .then(response => {
    // 检查HTTP响应状态
    if (!response.ok) {
      throw new Error(`HTTP error! Status: ${response.status}`);
    }
    // 解析JSON响应（根据实际接口返回格式调整）
    return response.json();
  })
